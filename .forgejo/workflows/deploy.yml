name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: websites
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        run: |
          rsync -a --delete --exclude='.git' ./ /var/www/penzapeople/
          deploy add penzapeople /var/www/penzapeople --port 8086
